[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-automation"
version = "1.0.0"
description = "MCP server for automated code review using AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "AI Business Crew", email = "ai-crew@example.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["mcp", "code-review", "crewai"]
dependencies = ["mcp>=1.0.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://github.com/KennyWayn3/code-review-automation"
Repository = "https://github.com/KennyWayn3/code-review-automation"

[project.scripts]
code-review-automation = "code_review_automation.server:app.run"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_review_automation*"]
